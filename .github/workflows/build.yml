name: Build ATM

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # allows the manual "Run workflow" button

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release "$EXTRA"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ATM-VST3-${{ matrix.name }}
          path: build/AudioToMidi_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone app
        uses: actions/upload-artifact@v4
        with:
          name: ATM-Standalone-${{ matrix.name }}
          path: build/AudioToMidi_artefacts/Release/Standalone/
          if-no-files-found: warn

      # ---------- installers ----------
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true          # a failed installer must not hide the plugin itself
        shell: pwsh
        run: |
          Get-ChildItem -Force . | Select-Object Name
          if (-not (Test-Path ATM.iss)) { Write-Host "::error::ATM.iss is missing in the repository"; exit 1 }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC: $iscc"
          Get-ChildItem build\AudioToMidi_artefacts\Release -Recurse -Depth 2 | Select-Object -First 30 FullName
          & $iscc "/DVstDir=$env:GITHUB_WORKSPACE\build\AudioToMidi_artefacts\Release\VST3" "/DStandaloneDir=$env:GITHUB_WORKSPACE\build\AudioToMidi_artefacts\Release\Standalone" "ATM.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ATM-Installer-Windows
          path: output/ATM-Setup-Windows.exe
          if-no-files-found: warn

      - name: macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3
          cp -R build/AudioToMidi_artefacts/Release/VST3/ATM.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          pkgbuild --root pkgroot --identifier com.coteria.atm --version 1.0.0 \
                   --install-location / ATM-Setup-macOS.pkg

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ATM-Installer-macOS
          path: ATM-Setup-macOS.pkg
          if-no-files-found: error
